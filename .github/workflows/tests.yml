name: Tests

# Runs the tests for the shared camera code and the name generator. They need no camera and no Sony SDK:
# a fake camera stands in for CamBridge, and the SDK names come from tests/CamRemote.Tests/FakeSdk.
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Name generator
        run: python -m unittest discover -s tests -p "test_*.py" -v
      - name: Shared camera code
        run: dotnet test tests/CamRemote.Tests/CamRemote.Tests.csproj
