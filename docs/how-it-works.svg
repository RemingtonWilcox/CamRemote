<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" width="1200" height="600" role="img" aria-labelledby="title desc">
  <title id="title">How CamRemote works</title>
  <desc id="desc">The camera sends its picture to CamRemote on your computer over Wi-Fi, and your phone can join in. When an animal appears, the app sees it, the camera records, and it stops 15 seconds after the animal leaves.</desc>
  <defs>
    <style>
      text { font-family: "Segoe UI", -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif; fill: #F2F2F2; }
      .head { font-size: 15px; font-weight: 600; letter-spacing: 1.4px; fill: #9A9A9A; }
      .name { font-size: 26px; font-weight: 600; text-anchor: middle; }
      .sub { font-size: 16px; fill: #A8A8A8; text-anchor: middle; }
      .link { font-size: 16px; fill: #C8C8C8; text-anchor: middle; }
      .step { font-size: 21px; font-weight: 600; text-anchor: middle; }
      .box { fill: #2B2B2B; stroke: #444; stroke-width: 1.5; }
      .main { fill: #2B2B2B; stroke: #2FD6FF; stroke-width: 2.5; }
      .wire { stroke: #2FD6FF; stroke-width: 2.5; fill: none; }
      .soft { stroke: #8A8A8A; stroke-width: 2; stroke-dasharray: 7 7; fill: none; }
    </style>
    <marker id="tip" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 Z" fill="#2FD6FF" />
    </marker>
    <marker id="softtip" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 Z" fill="#8A8A8A" />
    </marker>
  </defs>

  <rect width="1200" height="600" rx="16" fill="#1E1E1E" />

  <text class="head" x="44" y="56">HOW IT CONNECTS</text>

  <rect class="box" x="44" y="84" width="240" height="124" rx="12" />
  <text class="name" x="164" y="140">Sony camera</text>
  <text class="sub" x="164" y="170">records to its own card</text>

  <rect class="main" x="480" y="84" width="240" height="124" rx="12" />
  <text class="name" x="600" y="140">CamRemote</text>
  <text class="sub" x="600" y="170">on your computer</text>

  <rect class="box" x="916" y="84" width="240" height="124" rx="12" />
  <text class="name" x="1036" y="140">Your phone</text>
  <text class="sub" x="1036" y="170">optional</text>

  <path class="wire" d="M292,132 H472" marker-start="url(#tip)" marker-end="url(#tip)" />
  <text class="link" x="382" y="118">Wi-Fi</text>

  <path class="soft" d="M292,178 H472" marker-end="url(#softtip)" />
  <text class="link" x="382" y="202">HDMI capture card</text>
  <text class="sub" x="382" y="224">optional, sharpest picture</text>

  <path class="wire" d="M728,146 H908" marker-start="url(#tip)" marker-end="url(#tip)" />
  <text class="link" x="818" y="132">home Wi-Fi or Tailscale</text>

  <line x1="44" y1="274" x2="1156" y2="274" stroke="#3A3A3A" stroke-width="1.5" />

  <text class="head" x="44" y="324">WHEN AN ANIMAL SHOWS UP</text>

  <rect class="box" x="44" y="352" width="240" height="124" rx="12" />
  <text class="step" x="164" y="408">It appears</text>
  <text class="sub" x="164" y="438">in the camera's view</text>

  <rect class="main" x="334" y="352" width="240" height="124" rx="12" />
  <text class="step" x="454" y="408">The app spots it</text>
  <text class="sub" x="454" y="438">checks once a second</text>

  <rect class="box" x="624" y="352" width="240" height="124" rx="12" />
  <text class="step" x="744" y="408">The camera records</text>
  <text class="sub" x="744" y="438">and focuses on the animal</text>

  <rect class="box" x="914" y="352" width="242" height="124" rx="12" />
  <text class="step" x="1035" y="408">It stops by itself</text>
  <text class="sub" x="1035" y="438">15 seconds after it leaves</text>

  <path class="wire" d="M288,414 H330" marker-end="url(#tip)" />
  <path class="wire" d="M578,414 H620" marker-end="url(#tip)" />
  <path class="wire" d="M868,414 H910" marker-end="url(#tip)" />

  <text class="sub" x="600" y="538">The animal check runs on your computer. No pictures leave it.</text>
</svg>
